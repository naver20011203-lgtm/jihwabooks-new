<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 브라우저 캐시 방지 메타태그 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- 새 세션/새 링크 접속 시 최신 버전 자동 새로고침 및 캐시 버스팅 -->
  <script>
    (function () {
      // iPad / Safari 최적화: 이미지 비동기 디코딩 및 메인 스레드 프리징 방지
      try {
        if (typeof HTMLImageElement !== 'undefined') {
          HTMLImageElement.prototype.decoding = 'async';
        }
      } catch (e) {}

      try {
        const sessionKey = '__jihwa_session_refreshed__';
        const hasSession = sessionStorage.getItem(sessionKey);
        // 새 탭/새 링크로 열었을 때 최신 변경사항을 가져오기 위한 1회 자동 새로고침
        if (!hasSession) {
          sessionStorage.setItem(sessionKey, '1');
          const url = new URL(window.location.href);
          const currentT = url.searchParams.get('_t');
          const now = Date.now().toString();
          if (!currentT || Math.abs(parseInt(currentT, 10) - parseInt(now, 10)) > 5000) {
            url.searchParams.set('_t', now);
            window.location.replace(url.toString());
            return;
          }
        }
      } catch (e) {}

      // 모바일/PC 뒤로가기 또는 브라우저 캐시(bfcache) 복원 시 자동 새로고침
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) {
          window.location.reload();
        }
      });
    })();
  </script>
  <!-- 전역 무한루프 배경음악 (대기화면 시작 전 최우선 로드 및 즉각 재생) -->
  <script>
    (function () {
      const audio = new Audio('02_motions/bgm.mp3');
      audio.loop = true;
      audio.preload = 'auto';
      audio.volume = 0.80; // 빗소리(0.08) 대비 충분히 크고 풍성한 메인 음악 볼륨
      audio.addEventListener('error', function () {
        if (!audio.src.endsWith('/bgm.mp3') && !audio.src.endsWith('bgm.mp3')) {
          audio.src = 'bgm.mp3';
          audio.load();
          if (window.tryPlayBgm) window.tryPlayBgm();
        }
      });
      window.bgmAudio = audio;

      // 71페이지(장면 69)부터 재생되는 엔딩 배경음악
      const endingAudio = new Audio('02_motions/ending_bgm.mp3');
      endingAudio.loop = true;
      endingAudio.preload = 'auto';
      endingAudio.volume = 0.80;
      endingAudio.addEventListener('error', function () {
        if (!endingAudio.src.endsWith('/ending_bgm.mp3') && !endingAudio.src.endsWith('ending_bgm.mp3')) {
          endingAudio.src = 'ending_bgm.mp3';
          endingAudio.load();
          if (window.switchToEndingBgm && window.__IS_ENDING_BGM_ACTIVE__) window.switchToEndingBgm();
        }
      });
      window.endingBgmAudio = endingAudio;

      window.__IS_ENDING_BGM_ACTIVE__ = false;
      let bgmFadeTimer = null;

      window.fadeBgmVolume = function (targetVol, durationMs = 1800) {
        if (!window.bgmAudio) return;
        if (bgmFadeTimer) {
          clearInterval(bgmFadeTimer);
          bgmFadeTimer = null;
        }
        const startVol = window.bgmAudio.volume;
        const diff = targetVol - startVol;
        if (Math.abs(diff) < 0.008 || durationMs <= 0) {
          window.bgmAudio.volume = Math.max(0, Math.min(1, targetVol));
          return;
        }
        const interval = 40;
        const totalSteps = Math.max(1, Math.round(durationMs / interval));
        let step = 0;
        bgmFadeTimer = setInterval(function () {
          step++;
          const progress = Math.min(1, step / totalSteps);
          // 부드러운 S자 커브(quadratic ease-in-out)로 자연스러운 페이드 연출
          const ease = progress < 0.5
            ? 2 * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          const currentVol = startVol + diff * ease;
          window.bgmAudio.volume = Math.max(0, Math.min(1, currentVol));
          if (progress >= 1) {
            clearInterval(bgmFadeTimer);
            bgmFadeTimer = null;
          }
        }, interval);
      };

      window.tryPlayBgm = function () {
        if (window.__IS_ENDING_BGM_ACTIVE__) {
          if (window.switchToEndingBgm) window.switchToEndingBgm();
          return;
        }
        if (!window.bgmAudio) return;
        if (!window.bgmAudio.paused) return;
        try {
          const p = window.bgmAudio.play();
          if (p && typeof p.then === 'function') {
            p.catch(function () {});
          }
        } catch (e) {}
      };

      window.switchToEndingBgm = function () {
        window.__IS_ENDING_BGM_ACTIVE__ = true;
        if (bgmFadeTimer) {
          clearInterval(bgmFadeTimer);
          bgmFadeTimer = null;
        }
        if (window.bgmAudio && !window.bgmAudio.paused) {
          try { window.bgmAudio.pause(); } catch (e) {}
        }
        if (window.endingBgmAudio) {
          window.endingBgmAudio.volume = 0.80;
          if (window.endingBgmAudio.paused) {
            try {
              const p = window.endingBgmAudio.play();
              if (p && typeof p.then === 'function') {
                p.catch(function () {});
              }
            } catch (e) {}
          }
        }
      };

      window.switchToMainBgm = function (sceneNumber) {
        window.__IS_ENDING_BGM_ACTIVE__ = false;
        if (window.endingBgmAudio && !window.endingBgmAudio.paused) {
          try {
            window.endingBgmAudio.pause();
            window.endingBgmAudio.currentTime = 0;
          } catch (e) {}
        }

        // 68, 69, 70페이지(장면 66, 67, 68)는 71페이지 엔딩 음악의 극적인 등장을 위해 0.06(아주 얕은 볼륨)으로 페이드 아웃
        const isFaint = (sceneNumber !== undefined && sceneNumber !== null) && (
          sceneNumber === 66 || sceneNumber === 67 || sceneNumber === 68 ||
          sceneNumber === '66' || sceneNumber === '67' || sceneNumber === '68'
        );
        const targetVol = isFaint ? 0.06 : 0.80;

        if (window.bgmAudio) {
          if (window.bgmAudio.paused) {
            window.bgmAudio.volume = targetVol;
            try {
              const p = window.bgmAudio.play();
              if (p && typeof p.then === 'function') {
                p.catch(function () {});
              }
            } catch (e) {}
          } else {
            window.fadeBgmVolume(targetVol, isFaint ? 1800 : 800);
          }
        }
      };

      // 대기화면 로드 즉시 무조건 재생 시도
      window.tryPlayBgm();
      document.addEventListener('DOMContentLoaded', window.tryPlayBgm);
      window.addEventListener('load', window.tryPlayBgm);

      // 브라우저 정책으로 첫 로드 시 차단된 경우, 대기화면에서 유저의 어떤 첫 제스처든 발생하는 즉시 재생
      const bgmUnlockEvents = ['pointerdown', 'mousedown', 'keydown', 'touchstart', 'click', 'mousemove', 'pointermove', 'focus', 'wheel'];
      const onBgmGesture = function () {
        if (window.__IS_ENDING_BGM_ACTIVE__) {
          if (window.endingBgmAudio && window.endingBgmAudio.paused) {
            try { window.endingBgmAudio.play(); } catch (e) {}
          }
        } else {
          window.tryPlayBgm();
        }
        const isBgmPlaying = (window.bgmAudio && !window.bgmAudio.paused) || (window.endingBgmAudio && !window.endingBgmAudio.paused);
        if (isBgmPlaying) {
          bgmUnlockEvents.forEach(function (ev) {
            window.removeEventListener(ev, onBgmGesture, true);
            document.removeEventListener(ev, onBgmGesture, true);
          });
        }
      };
      bgmUnlockEvents.forEach(function (ev) {
        window.addEventListener(ev, onBgmGesture, { passive: true, capture: true });
        document.addEventListener(ev, onBgmGesture, { passive: true, capture: true });
      });

      // ========== 전체화면 전환 (휠 1회 클릭 진입 / 휠 2회 연속 클릭 복귀 / ESC 복귀) ==========
      function isFullscreen() {
        return !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );
      }

      function enterFullscreen() {
        const docEl = document.documentElement;
        try {
          if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(function () {});
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
          } else if (docEl.mozRequestFullScreen) {
            docEl.mozRequestFullScreen();
          } else if (docEl.msRequestFullscreen) {
            docEl.msRequestFullscreen();
          }
        } catch (e) {}
      }

      function exitFullscreen() {
        try {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(function () {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.mozCancelFullScreen) {
            document.mozCancelFullScreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        } catch (e) {}
      }

      window.isFullscreen = isFullscreen;
      window.enterFullscreen = enterFullscreen;
      window.exitFullscreen = exitFullscreen;

      let wheelExitCount = 0;
      let wheelExitTimer = null;

      function onWheelClick(e) {
        if (e.button !== 1) return; // 휠 클릭(가운데 버튼)만 감지
        e.preventDefault(); // 브라우저 기본 자동스크롤 아이콘 표시 차단

        if (!isFullscreen()) {
          // 전체화면이 아닐 때: 휠 1번 클릭 시 즉시 전체화면 전환
          enterFullscreen();
        } else {
          // 전체화면 상태일 때: 휠 2번 연속 클릭 시 전체화면 해제
          wheelExitCount++;
          clearTimeout(wheelExitTimer);
          if (wheelExitCount >= 2) {
            wheelExitCount = 0;
            exitFullscreen();
          } else {
            wheelExitTimer = setTimeout(function () {
              wheelExitCount = 0;
            }, 600); // 600ms 이내에 두 번째 휠 클릭 시 해제
          }
        }
      }

      window.addEventListener('mousedown', onWheelClick, true);
      window.addEventListener('auxclick', function (e) {
        if (e.button === 1) e.preventDefault();
      }, true);

      // ESC 키 입력 시에도 언제든 전체화면 해제
      window.addEventListener(
        'keydown',
        function (e) {
          if (e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27) {
            if (isFullscreen()) {
              exitFullscreen();
            }
          }
        },
        true
      );

      // ========== 마우스 좌우 버튼 동시 클릭 시 새로고침 ==========
      let isLeftDown = false;
      let isRightDown = false;
      let lastLeftTime = 0;
      let lastRightTime = 0;
      let isReloading = false;

      window.__IS_SIMULTANEOUS_RELOAD__ = function () {
        return isReloading;
      };

      window.__CANCEL_PREV_TIMER__ = function () {
        if (window.__PENDING_PREV_TIMER__) {
          clearTimeout(window.__PENDING_PREV_TIMER__);
          window.__PENDING_PREV_TIMER__ = null;
        }
      };

      function triggerSimultaneousReload(e) {
        if (isReloading) return;
        isReloading = true;

        if (e) {
          try { e.preventDefault(); } catch (err) {}
          try { e.stopPropagation(); } catch (err) {}
          if (typeof e.stopImmediatePropagation === 'function') {
            try { e.stopImmediatePropagation(); } catch (err) {}
          }
        }

        if (window.__CANCEL_PREV_TIMER__) {
          window.__CANCEL_PREV_TIMER__();
        }

        try {
          sessionStorage.removeItem('__jihwa_session_refreshed__');
        } catch (err) {}

        // 화면 즉시 새로고침
        window.location.reload();
      }

      function checkMouseButtons(e) {
        const now = performance.now();

        // 1) e.buttons 비트마스크: 1(좌클릭) + 2(우클릭) = 3
        if ((e.buttons & 1) && (e.buttons & 2)) {
          triggerSimultaneousReload(e);
          return true;
        }

        // 2) 내부 상태 추적: 좌클릭과 우클릭이 둘 다 눌려있는 상태
        if (isLeftDown && isRightDown) {
          triggerSimultaneousReload(e);
          return true;
        }

        // 3) 시간 간격: 좌우 버튼이 250ms 이내에 거의 동시에 눌린 경우
        if (Math.abs(lastLeftTime - lastRightTime) < 250 &&
            (now - lastLeftTime < 250) &&
            (now - lastRightTime < 250)) {
          triggerSimultaneousReload(e);
          return true;
        }

        return false;
      }

      function onAnyPointerDown(e) {
        if (e.pointerType && e.pointerType !== 'mouse') return;
        const now = performance.now();
        if (e.button === 0) {
          isLeftDown = true;
          lastLeftTime = now;
        } else if (e.button === 2) {
          isRightDown = true;
          lastRightTime = now;
        }

        if (checkMouseButtons(e)) {
          e.preventDefault();
          e.stopPropagation();
          if (typeof e.stopImmediatePropagation === 'function') {
            e.stopImmediatePropagation();
          }
        }
      }

      function onAnyPointerUp(e) {
        if (e.pointerType && e.pointerType !== 'mouse') return;
        if (e.button === 0) isLeftDown = false;
        if (e.button === 2) isRightDown = false;
      }

      window.addEventListener('pointerdown', onAnyPointerDown, true);
      window.addEventListener('mousedown', onAnyPointerDown, true);
      window.addEventListener('pointerup', onAnyPointerUp, true);
      window.addEventListener('mouseup', onAnyPointerUp, true);

      window.addEventListener('blur', function () {
        isLeftDown = false;
        isRightDown = false;
      });

      // contextmenu (우클릭 메뉴) 발생 시 좌우 동시 클릭 검사
      window.addEventListener('contextmenu', function (e) {
        const now = performance.now();
        if (isReloading || isLeftDown || ((e.buttons & 1) === 1) || (now - lastLeftTime < 250)) {
          triggerSimultaneousReload(e);
        }
      }, true);

      // 좌우 동시 클릭 시 좌클릭으로 인한 장면 이동/클릭 이벤트 전파 차단
      window.addEventListener('click', function (e) {
        const now = performance.now();
        if (isReloading || isRightDown || ((e.buttons & 2) === 2) || (now - lastRightTime < 250)) {
          e.preventDefault();
          e.stopPropagation();
          if (typeof e.stopImmediatePropagation === 'function') {
            e.stopImmediatePropagation();
          }
        }
      }, true);
    })();
  </script>

      width: 100%; height: 100%;

    }

    .sr-only {

    /* 12.9인치 가로 기준 스테이지 (1366 x 1024) — 다른 비율 기기에서는 중앙 배치 및 레터박스(검정) */

      18%  { transform: translate3d(0, -155px, 0) scale(0.90); opacity: 1; }
      21%  { transform: translate3d(0, -135px, 0) scale(0.89); opacity: 1; }
      25%  { transform: translate3d(0, -121px, 0) scale(0.88); opacity: 1; }

      /* 1단 위 안착 및 호흡 (8~11프레임) */

      39%  { transform: translate3d(0, -121px, 0) scale(0.88); opacity: 1; }

      /* 2번째 칸 도약 (12~16프레임): 중간 계단으로 톡 뜀 */
      43%  { transform: translate3d(0, -165px, 0) scale(0.85); opacity: 1; }

      57%  { transform: translate3d(0, -243px, 0) scale(0.78); opacity: 1; }

      /* 대사 출력 타이밍에 맞춰 계단 중간에 정지 유지 (17~28프레임) */
      61%  { transform: translate3d(0, -243px, 0) scale(0.78); opacity: 1; }
      100% { transform: translate3d(0, -243px, 0) scale(0.78); opacity: 1; }
    }

      width: 100%;
      height: 100%;
      display: block;
    }

    /* 노크 모션: 주먹으로 톡톡 두드리는 리듬감 있는 모션 (12.5fps 스톱모션) */
    .scene-04 .arm-cursor.knocking {
      animation: knockMotion 0.56s steps(7);
    }
    @keyframes knockMotion {
      0%   { transform: translate(-30.5%, -18.5%) scale(1); }
      20%  { transform: translate(-33%, -22%) scale(0.92) rotate(-4deg); }
      40%  { transform: translate(-28%, -15%) scale(1.08) rotate(3deg); }
      60%  { transform: translate(-32%, -20%) scale(0.95) rotate(-2deg); }
      80%  { transform: translate(-28%, -15%) scale(1.08) rotate(3deg); }
      100% { transform: translate(-30.5%, -18.5%) scale(1); }
    }
    /* 장면 번호 표시: '현재장면/총장면수' (DungGeunMo, #0000, 곱하기, 투명도 20, 18px)
       대화창 맨 아래 줄 또는 대화창 없는 화면의 동일 위치(가장 상단 레이어)에 배치 */
    .scene-counter {
      position: absolute;
      right: 14px;
      bottom: 8px;
      line-height: 1;
      font-family: 'DungGeunMo', monospace;
      font-size: 18px;
      color: #000000;
      opacity: 0.20;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 100;
      user-select: none;
    }
    .dialog-wrap .scene-counter {
      right: 14px;
    }

  
    /* ========== 우측 하단 페이지 번호 더블클릭 → 대사창 아래쪽 직사각형 칸(34px) 내 얇은 척도 바 ========== */
    .scene-counter {
      pointer-events: auto;
      cursor: pointer;
      padding: 6px 8px;
      margin: -6px -8px;
      z-index: 120;
    }

    .scene-progress-wrap {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 860px;
      height: 34px; /* 대사창 아래쪽 직사각형 칸(182px~216px, 높이 34px) 정중앙 배치 */
      z-index: 118;
      pointer-events: auto;
      cursor: pointer;
      display: none;
      align-items: center;
      user-select: none;
      touch-action: none;
    }

    .dialog-wrap .scene-progress-wrap {
      left: calc(50% - 3px); /* .dialog-wrap 우측 6px 확장에 맞춘 스테이지 정중앙 정렬 */
    }

    .scene-progress-wrap.open {
      display: flex;
    }

    .scene-progress-wrap.dragging {
      cursor: grabbing;
    }

    .scene-progress-bar {
      position: relative;
      width: 100%;
      height: 8px; /* 대사창 하단 직사각형 칸 안에 들어가는 얇은 척도 바 */
      background: rgba(75, 15, 95, 0.38) url('02_motions/progress_bar.png') no-repeat center / 100% 100%;
      overflow: hidden;
      border-radius: 4px;
      transform-origin: 50% 50%;
      transition: filter 0.18s ease, transform 0.22s cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    .scene-progress-wrap:hover .scene-progress-bar,
    .scene-progress-wrap.dragging .scene-progress-bar {
      transform: scaleY(1.35);
      filter: brightness(1.25);
    }

    .scene-progress-hover {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: calc(var(--hover-ratio, 0) * 100%);
      background: rgba(230, 200, 255, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .scene-progress-wrap:hover .scene-progress-hover {
      opacity: 1;
    }

    .scene-progress-wrap.dragging .scene-progress-hover {
      opacity: 0;
    }

    .scene-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: rgba(75, 15, 95, 0.55) url('02_motions/progress_gauge.png') repeat-x left center / auto 100%;
      transition: width 0.25s cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    .scene-progress-wrap.dragging .scene-progress-fill {
      transition: none;
    }

    .scene-progress-fill::after {
      content: '';
      position: absolute;
      top: 1px;
      bottom: 1px;
      right: 0;
      width: 3px;
      border-radius: 2px;
      background: rgba(255, 240, 255, 0.9);
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .scene-progress-wrap:hover .scene-progress-fill::after,
    .scene-progress-wrap.dragging .scene-progress-fill::after {
      opacity: 1;
      animation: progressMarkerPulse 1.2s ease-in-out infinite;
    }

    @keyframes progressMarkerPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.45; }
    }
  
  </style>

<body>

  <div id="bridgeOverlay"></div>

  <!-- S1 및 S2 원본 소스코드 완전 무손실 텍스트 보관소 -->
  <script type="text/plain" id="s1-css-data">

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0);
    }

    /* 12.9인치 가로 기준 스테이지 (1366 x 1024) — 다른 비율 기기에서는 중앙 배치 및 레터박스(검정) */
    .stage {
      position: absolute;
      left: 50%; top: 50%;
      width: 1366px; height: 1024px;
      overflow: visible;
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
    }

    /* 화면 바깥으로 나간 그래픽을 완벽하게 가려주는 최상단 블랙 마스킹 레이어 (2000px 블랙 테두리) */
    .stage::after {
      content: '';
      position: absolute;
      inset: -2000px;
      border: 2000px solid #000000;
      pointer-events: none;
      z-index: 999999;
    }
    .stage-black-mask {
      position: absolute;
      background: #000000;
      pointer-events: none;
      z-index: 999999;
    }
    .stage-black-mask.mask-right {
      left: 1366px;
      top: -2000px;
      width: 4000px;
      height: 6000px;
    }
    .stage-black-mask.mask-left {
      right: 1366px;
      top: -2000px;
      width: 4000px;
      height: 6000px;
    }
    .stage-black-mask.mask-top {
      left: -2000px;
      bottom: 1024px;
      width: 6000px;
      height: 4000px;
    }
    .stage-black-mask.mask-bottom {
      left: -2000px;
      top: 1024px;
      width: 6000px;
      height: 4000px;
    }

    /* 각 장면 공통 */
    .scene {
      position: absolute; inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      contain: layout size;
      background-color: #000000;
    }

    .scene .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* 전환: 위로 슬라이드 (부드럽고 빠른 1.6s 커튼콜) */
    .scene.slide-up-out {
      will-change: transform;
      animation: slideUpOut 1.6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      z-index: 10;
    }
    @keyframes slideUpOut {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(0, -100%, 0); }
    }

    /* 전환: 페이드 (2분 무입력 시 대기화면 복귀) */
    .scene.fade-in {
      will-change: opacity;
      animation: fadeIn 0.8s ease forwards;
      z-index: 10;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ========== 대기화면(0번 장면 / Scene 1): 외벽 꽃 3개 살랑임 ========== */
    .flower {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }
    .f1, .flower.f1 { left: 957px; top: 178px; width: 219.5px; height: 229.5px; }
    .f2, .flower.f2 { left: 949px; top: 443px; width: 133px;   height: 145px;   }
    .f3, .flower.f3 { left: 985px; top: 615px; width: 172px;   height: 181px;   }

    .flower img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transform-origin: 50% 50%;
      animation: s01sway 2s steps(25) infinite alternate;
      backface-visibility: hidden;
      will-change: transform;
    }

    .f1 img, .flower.f1 img { --a: -5deg;   --b: 4deg; }
    .f2 img, .flower.f2 img { --a: 6deg;    --b: -4deg; }
    .f3 img, .flower.f3 img { --a: -3.5deg; --b: 5.5deg; }

    /* 대기화면: 좌측 글자 기준 오른쪽에 있는 '글이 쓰인 붉은 모양' 호버 반응 영역 */
    .title-trigger-shape {
      position: absolute;
      left: 0;
      top: 0;
      width: 1366px;
      height: 1024px;
      clip-path: polygon(545px 80px, 473px 105px, 446px 130px, 430px 155px, 421px 180px, 416px 205px, 416px 230px, 421px 255px, 431px 280px, 448px 305px, 436px 330px, 424px 355px, 417px 380px, 416px 405px, 419px 430px, 427px 455px, 440px 480px, 453px 505px, 434px 530px, 423px 555px, 417px 580px, 416px 605px, 419px 630px, 428px 655px, 442px 680px, 461px 705px, 439px 730px, 426px 755px, 418px 780px, 416px 805px, 418px 830px, 424px 855px, 437px 880px, 458px 905px, 494px 930px, 1136px 930px, 1172px 905px, 1193px 880px, 1205px 855px, 1212px 830px, 1214px 805px, 1211px 780px, 1204px 755px, 1191px 730px, 1169px 705px, 1187px 680px, 1202px 655px, 1211px 630px, 1214px 605px, 1213px 580px, 1207px 555px, 1195px 530px, 1177px 505px, 1189px 480px, 1203px 455px, 1211px 430px, 1214px 405px, 1212px 380px, 1206px 355px, 1194px 330px, 1182px 305px, 1198px 280px, 1209px 255px, 1213px 230px, 1214px 205px, 1209px 180px, 1199px 155px, 1183px 130px, 1156px 105px, 1084px 80px);
      z-index: 20;
      cursor: pointer;
    }

    /* 대기화면: 좌측 녹색 글자 영역 (더블클릭 시 전체화면 / 프레젠테이션 모드 전환) */
    .title-fullscreen-zone {
      position: absolute;
      left: 95px;
      top: 80px;
      width: 230px;
      height: 870px;
      z-index: 20;
      cursor: pointer;
    }



    @keyframes s01sway {
      from { transform: rotate(var(--a)) translateZ(0); }
      to   { transform: rotate(var(--b)) translateZ(0); }
    }

    /* ========== 2장면: 비 내리는 책방 및 텍스트 ========== */
    .scene-02 .rain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1; /* 곱하기 투명도 레이어(.veil) 아래에 위치 */
    }

    .scene-02 .veil {
      position: absolute; inset: 0;
      background: #453E72;
      opacity: 0.9;
      mix-blend-mode: multiply;
      transition: opacity 2.4s ease;
      z-index: 2; /* 빗줄기 위에 위치하여 곱하기 블렌드 효과 적용 */
    }
    .scene-02 .veil.gone { opacity: 0; }

    @font-face {
      font-family: 'DungGeunMo';
      src: url('04_filters_fonts/DungGeunMo.otf') format('opentype');
    }

    .scene-02 .guide-text {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      font-family: 'DungGeunMo', monospace;
      font-size: 42px;
      line-height: 1.6;
      color: #615CB7;
      text-align: center;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      transition: opacity 2.4s ease;
      z-index: 3;
    }
    .scene-02 .guide-text.gone { opacity: 0; }
    .scene-02 .guide-text .ch {
      display: inline-block;
      visibility: hidden;
    }
    .scene-02 .guide-text .ch.on { visibility: visible; }

    /* ========== 3장면: 책방 앞 + 초록 대화창 & 대사 타이핑 ========== */
    .scene-03 .rain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ========== 대화창 공통 스타일 & 텍스트 규칙 (가장 상단 레이어) ========== */
    .dialog-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 216px;
      z-index: 100; /* 최상단 레이어 */

    .dialog-wrap .dialog-bg {

    .dialog-wrap .dialog-text {

    .dialog-wrap .ch.on {

    /* 그린 텍스트 규칙 (You: #308DA4) */
    .dialog-wrap.green .speaker,
    .scene-03 .speaker,
    .scene-04 .speaker,
    .scene-06 .speaker,
    .scene-10 .speaker,

    .scene-16 .speaker {

      margin-right: 14px;
    }

    /* 레드 텍스트 규칙 (P: #D13D79) */
    .dialog-wrap.red .speaker,
    .scene-05 .speaker,
    .scene-07 .speaker,
    .scene-08 .speaker,
    .scene-09 .speaker,
    .scene-11 .speaker,
    .scene-13 .speaker,

    .scene-17 .speaker,
    .scene-18 .speaker,
    .scene-19 .speaker {

    }

    /* 퍼플 텍스트 규칙 및 보라색 대화창: 화면 바깥으로 넉넉하게 확장하여 틈새 완전 차단 */
    .dialog-wrap.purple {
      background: linear-gradient(
        to bottom,
        #702188 0px,
        #702188 34px,
        #4C105E 34px,
        #4C105E 182px,
        #702188 182px,
        #702188 216px
      );
    }
    .dialog-wrap.purple .dialog-bg {
      position: absolute;
      left: 0;

      content: '';
      position: absolute;
      left: 100%;
      top: 0;
      width: 500px;
      height: 100%;
      background: linear-gradient(
        to bottom,
        #702188 0px,
        #702188 34px,
        #4C105E 34px,
        #4C105E 182px,
        #702188 182px,
        #702188 216px

    .dialog-wrap.purple .knock-guide {
      color: #615CB7;
    }

    /* ========== 전체 장면 공통 컬러 필터 레이어 (#FFDB3B, 25%, multiply, 대기화면 포함) ========== */
    .scene-color-filter {
      position: absolute;
      left: 0;
      top: 0;
      width: 1366px;
      height: 1024px;
      background-color: #FFDB3B;
      opacity: 0.25;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 45; /* 대화창(z-index: 50) 바로 아래, 씬 내 그래픽/모션 요소 최상단 */

    .scene-color-filter.with-dialog,
    .scene:has(.dialog-wrap) .scene-color-filter {
      height: 809px; /* 대화창 영역을 침범하지 않도록 상단에만 밀착 배치 (1366*809) */
    }

    /* ========== 4장면: 노크 장면 (배경, 도어 슬라이드, arm 마우스 커서, 타이핑) ========== */
    
    /* 대사가 시작되는 3장면('으으 추워... 저기인가?')부터: 별도 커서가 지정되지 않은 일반 영역에 커스텀 팔 커서 적용 (1~2장면은 기본 커서 유지) */

    .rain {

    .scene-04 .rain,
    .scene-05 .rain,
    .scene-06 .rain,
    .scene-11 .rain {
      z-index: 2; /* 꽃 레이어(z-index: 1) 위에서 비가 가림 없이 내리도록 설정 */

    /* 4장면, 5장면, 6장면: 3장면(03.png) 꽃 위치와 100% 동일하게 일치시키는 꽃 레이어 */

    /* 7장면, 8장면, 9장면: 비둘기 날개 (몸통 기준 안쪽 고정점, 위아래 살짝 날갯짓) */

    }
    .pigeon-wing.right {
      right: 165px;
      top: 430px;
      transform-origin: 10% 45%;
      animation: wingFlapRight 1.44s steps(18) infinite alternate;
    }
    @keyframes wingFlapLeft {
      0%   { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }
    @keyframes wingFlapRight {
      0%   { transform: rotate(5deg); }
      100% { transform: rotate(-5deg); }

    /* 4장면 슬라이딩 도어 (24프레임 전개) */
    .scene-04 .door {
      position: absolute;

  <script type="text/plain" id="s1-js-data">

    /* ==============================================================
       장면 1 (대기화면: 꽃 3송이 살랑임, 마우스 이동 시 슬라이드업 전환)
       ============================================================== */
    window.SCENES = window.SCENES || {};
    window.SCENES[1] = {
      mount(el, app) {
        if (window.tryPlayBgm) window.tryPlayBgm();
        el.innerHTML = `
          <img class="bg" src="01_backgrounds/01.png" alt="">
          <div class="flower f1"><img src="02_motions/01 Delphinium 1 (x979.08 y163.95)).png" alt=""></div>
          <div class="flower f2"><img src="02_motions/01 Delphinium 2 (x962.99 y425.21)).png" alt=""></div>
          <div class="flower f3"><img src="02_motions/01 Delphinium 3 (x998.87 y597.38)).png" alt=""></div>
          <div class="title-fullscreen-zone" title="더블클릭: 프레젠테이션 모드(전체화면)"></div>
          <div class="title-trigger-shape" title="지화책방 들어가기"></div>
        `;

        // 진입 직후의 마우스 오작동 방지
        let armed = false;
        const armTimer = setTimeout(() => (armed = true), 400);

        const onTrigger = (e) => {
          if (window.tryPlayBgm) window.tryPlayBgm();
          if (!armed) return;
          cleanup();
          app.goTo(2, 'slideUp');
        };

        const triggerEl = el.querySelector('.title-trigger-shape');
        const fsZone = el.querySelector('.title-fullscreen-zone');

        const onFsDblClick = (e) => {
          e.stopPropagation();
          if (window.tryPlayBgm) window.tryPlayBgm();
          if (window.enterFullscreen) {
            if (window.isFullscreen && window.isFullscreen()) {
              if (window.exitFullscreen) window.exitFullscreen();
            } else {
              window.enterFullscreen();
            }
          }
        };

        const cleanup = () => {
          clearTimeout(armTimer);
          if (triggerEl) {
            triggerEl.removeEventListener('pointerenter', onTrigger);
            triggerEl.removeEventListener('pointermove', onTrigger);
            triggerEl.removeEventListener('pointerdown', onTrigger);
          }
          if (fsZone) {
            fsZone.removeEventListener('dblclick', onFsDblClick);
          }
        };

        if (triggerEl) {
          triggerEl.addEventListener('pointerenter', onTrigger);
          triggerEl.addEventListener('pointermove', onTrigger);
          triggerEl.addEventListener('pointerdown', onTrigger);
        }
        if (fsZone) {
          fsZone.addEventListener('dblclick', onFsDblClick);
        }

        return {
          unmount: cleanup,
        };
      },
    };

    /* ==============================================================
       장면 2 (비 내리는 책방: 12.5fps 빗줄기, 타이핑 문구, 클릭 시 글자 흩어짐)
       ============================================================== */
    window.SCENES[2] = {
      mount(el, app) {
        el.innerHTML = `
          <img class="bg" src="01_backgrounds/02.png" alt="">

          <div class="veil"></div>

        const stopRain = startRain(el.querySelector('.rain'));
        const veil = el.querySelector('.veil');
        const textEl = el.querySelector('.guide-text');
        const typing = typeText(textEl, [
          '마우스 왼쪽 버튼을 눌러 이야기를 이어가세요.',
          '오른쪽 버튼을 누르면 이전 장면으로 돌아갑니다.',
        ]);

        // 2장면 진행 단계 (0: 텍스트/필터 상태 -> 1번째 클릭 시 페이드아웃 및 대기 -> 2번째 클릭 시 3장면 전환)
        let phase = 0;
        let lastClickTime = 0;
        const onClick = (e) => {
          if (e.button !== 0) return;
          const now = performance.now();

          if (phase === 0) {
            // [1번째 클릭] 타이핑 즉시 완료 및 보라색 필터 레이어 + 텍스트가 0%로 서서히 페이드아웃

        // PNG 파일의 원본 크기와 종횡비(가로세로 비율)를 100% 온전하게 보존

        const stage = document.getElementById('stage');
        let stageRect = stage.getBoundingClientRect();
        const updateRect = () => { stageRect = stage.getBoundingClientRect(); };
        window.addEventListener('resize', updateRect);

        let targetX = 1120, targetY = 500;
        let currentX = 1120, currentY = 500;
        let armRaf = 0;

        const onMouseMove = (e) => {
          if (armEl.style.display === 'none') return;
          const scale = stageRect.width / 1366;

          const stageY = (e.clientY - stageRect.top) / scale;

          const minY = stageX < 740 ? 130 + (740 - stageX) * 0.4 : 120;
          targetX = Math.max(520, Math.min(1150, stageX));
          targetY = Math.max(minY, Math.min(760, stageY));
        };

        const renderArm = () => {
          if (armEl.style.display !== 'none') {

            currentX += (targetX - currentX) * 0.35;
            currentY += (targetY - currentY) * 0.35;
            armEl.style.left = currentX.toFixed(2) + 'px';
            armEl.style.top = currentY.toFixed(2) + 'px';

        let phase = 'WAIT_KNOCK'; // 'WAIT_KNOCK' -> 'KNOCKING' -> 'DOOR_OPENING'
        let openTimer = null;

              55,
              150,
              { dimParen: true }
            );
          }, 1250);
        }

        const handleClick = (e) => {
          if (e.button !== 0) return;

          if (phase === 'WAIT_KNOCK') {
            const scale = stageRect.width / 1366;
            const sx = (e.clientX - stageRect.left) / scale;
            const sy = (e.clientY - stageRect.top) / scale;
            if (sx >= 580 && sx <= 920 && sy >= 80 && sy <= 760) {
              triggerKnock();
            } else if (!typing.isFinished()) {
              typing.finish();
            }
          } else if (phase === 'KNOCKING') {
            return;
          } else if (phase === 'DOOR_OPENING') {
            if (dialogTyping && !dialogTyping.isFinished()) {
              dialogTyping.finish();
            } else {
              app.next('fade');
            }
          }
        };

        const onDoorClick = (e) => {
          if (e.button !== 0) return;
          if (phase === 'WAIT_KNOCK') {

            triggerKnock();
          }
        };

            typing.stop();

            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('resize', updateRect);
            doorEl.removeEventListener('click', onDoorClick);
            el.removeEventListener('click', handleClick);
          },
        };

    /* ---------- 웹 오디오 노크 효과음 합성 재생 (똑-똑) ---------- */
    function playKnockSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        function singleKnock(time, freq) {
          // 1. 우드 바디 공명음 (삼각파 피치 드롭)
          const osc = ctx.createOscillator();
          const oscGain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.25, time + 0.09);

          oscGain.gain.setValueAtTime(0.85, time);
          oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);

          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          osc.start(time);
          osc.stop(time + 0.09);

          // 2. 주먹 타격 임팩트 (노이즈 버스트)
          const bufferSize = Math.floor(ctx.sampleRate * 0.025);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const noiseFilter = ctx.createBiquadFilter();
          noiseFilter.type = 'lowpass';
          noiseFilter.frequency.setValueAtTime(900, time);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.95, time);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.025);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          noise.start(time);
          noise.stop(time + 0.025);
        }

        const now = ctx.currentTime;
        singleKnock(now + 0.16, 175); // 첫 번째 똑
        singleKnock(now + 0.38, 165); // 두 번째 똑
      } catch (e) {
        console.warn('Knock sound error:', e);
      }
    }

    /* ---------- 타이핑 모션 (커튼콜 1.6s 완료 후 1.7s 시점 등장, 32ms 빠른 속도) ---------- */
    function typeText(el, lines, speed = 32, startDelay = 1700) {
      const chars = [];
      lines.forEach((line, li) => {
        if (li) el.appendChild(document.createElement('br'));
        for (const c of line) {
          const s = document.createElement('span');
          s.className = 'ch';
          s.textContent = c === ' ' ? '\u00A0' : c;
          el.appendChild(s);
          chars.push(s);
        }
      });

      let i = 0, timer = 0;
      const step = () => {
        if (i >= chars.length) return;
        chars[i++].classList.add('on');
        timer = setTimeout(step, speed);
      };
      timer = setTimeout(step, startDelay);

      return {
        finish() { clearTimeout(timer); chars.forEach((c) => c.classList.add('on')); i = chars.length; },
        stop() { clearTimeout(timer); },
      };
    }

    /* ---------- 대사 타이핑 모션 (화자 + 대사 순차 출력, 괄호는 항상 투명도 30% 기본 적용) ---------- */
    function typeDialog(speakerEl, speakerText, bodyEl, bodyText, speed = 45, startDelay = 400, options = {}) {
      const chars = [];
      const dimParen = options.dimParen !== false; // 기본값 true: 대사 중 괄호 부분은 항상 투명도 30% 적용

      // 화자 (You: / P:)
      for (const c of speakerText) {
        const s = document.createElement('span');
        s.className = 'ch';
        s.textContent = c === ' ' ? '\u00A0' : c;
        speakerEl.appendChild(s);
        chars.push(s);
      }

      // 대사 내용 (괄호 안팎 텍스트 투명도 30% 자동 적용)
      let inParen = false;
      for (const c of bodyText) {
        if (dimParen && c === '(') inParen = true;
        const s = document.createElement('span');
        s.className = (dimParen && inParen) ? 'ch dim' : 'ch';
        s.textContent = c === ' ' ? '\u00A0' : c;
        bodyEl.appendChild(s);
        chars.push(s);
        if (dimParen && c === ')') inParen = false;
      }

      let i = 0, timer = 0;
      let finished = false;

      const step = () => {
        if (i >= chars.length) {
          finished = true;
          return;
        }
        chars[i++].classList.add('on');
        timer = setTimeout(step, speed);
      };
      timer = setTimeout(step, startDelay);

      return {
        isFinished: () => finished,
        finish() {
          clearTimeout(timer);
          chars.forEach((c) => c.classList.add('on'));
          i = chars.length;
          finished = true;
        },
        stop() {
          clearTimeout(timer);
        },
      };
    }

      img.src = '02_motions/02-07, 12-13 rain line .png';

      const BASE_LEAN = Math.atan2(90, 119); // 약 37.1도 왼쪽 기울기
      const SPEED = 12;

      // 배경 요소의 상단 이동 오프셋 (2장면: 0, 3~6, 11장면: -85px)
      const noMask = options.noMask === true;
      const offsetY = options.offsetY ?? 0;
      const buildingLeft = 379;
      const buildingRight = 899;
      const signLeft = 898;
      const signRight = 1015;
      const buildingTop = 165 + offsetY;
      const buildingBottom = 840 + offsetY;
      const signTop = 205 + offsetY;
      const signBottom = 516 + offsetY;
      const bottomY = 825 + offsetY;

      // 화면에 자연스럽게 내리는 적정 수량 (약 60개)
      const COUNT = 60;
      const TOTAL_SPAN = W + 700; // -100 ~ W+600
      const START_X = -100;

      // 평행 궤적(lineX) 상에서 서로 겹치지 않도록 최소 이격 거리 검증하며 배치
      const drops = [];
      const MIN_DX = 24;  // 가로 궤적 최소 간격 (겹침 방지)
      const MIN_DY = 130; // 동일/인접 궤적 간의 세로 최소 간격

      for (let i = 0; i < COUNT; i++) {
        let bestX = 0, bestY = 0;
        let found = false;

        for (let attempt = 0; attempt < 80; attempt++) {
          const testX = START_X + Math.random() * TOTAL_SPAN;
          const testY = Math.random() * (H + BASE_H * 2) - BASE_H;

          // 기존 빗줄기들과 겹치는지 체크
          const overlapped = drops.some((d) => {
            const dx = Math.abs(d.originX - testX);
            const dy = Math.abs(d.y - testY);
            return dx < MIN_DX && dy < MIN_DY;
          });

          if (!overlapped) {
            bestX = testX;
            bestY = testY;
            found = true;
            break;
          }
        }

        if (!found) {
          bestX = START_X + (i / COUNT) * TOTAL_SPAN;
          bestY = Math.random() * (H + BASE_H * 2) - BASE_H;
        }

        // 개별적으로 아주 살짝 다르게 적용되는 미세 회전각 (약 -4도 ~ +4도 편차)
        const rotJitter = (Math.random() - 0.5) * (8 * Math.PI / 180);
        const actualLean = BASE_LEAN + rotJitter;
        const driftRatio = -Math.tan(actualLean); // 선의 기울기와 정확히 일치하여 떨어짐

        drops.push({
          originX: bestX,
          rot: rotJitter,
          driftRatio: driftRatio,
          x: bestX + (bestY / SPEED) * (SPEED * driftRatio),
          y: bestY,
          resetY: -BASE_H - (Math.random() * 80),
        });
      }

      // 초당 12.5프레임 갱신 (스톱모션 통일 규격: 80ms)
      const FPS = 12.5, STEP = 1000 / FPS;
      let raf = 0, last = performance.now();
      const tick = (now) => {
        raf = requestAnimationFrame(tick);
        if (now - last < STEP) return;
        const dt = Math.min((now - last) / 16.67, 12);
        last = now;
        ctx.clearRect(0, 0, W, H);
        if (img.complete && img.naturalWidth) {
          const moveY = SPEED * dt;

          for (const d of drops) {
            d.y += moveY;
            d.x += SPEED * d.driftRatio * dt;

            // 바닥을 벗어나면 자신의 고유 궤적(originX) 상단으로 순환 (서로 겹치지 않는 배치 영구 보존)
            if (d.y > H + BASE_H) {
              d.y = d.resetY;
              d.x = d.originX + (d.y / SPEED) * (SPEED * d.driftRatio);
            }

            // [침범 방지 1차] 건물 본체, 간판, 바닥 영역에 닿으면 생략 (간판 아래 영역은 통과하여 비가 내림)
            if (!noMask) {
              const inMain = (d.x >= buildingLeft && d.x <= buildingRight && d.y >= buildingTop && d.y <= buildingBottom);
              const inSign = (d.x >= signLeft && d.x <= signRight && d.y >= signTop && d.y <= signBottom);
              const inBottom = (d.y >= bottomY);
              if (inMain || inSign || inBottom) continue;
            }

            ctx.save();
            ctx.translate(d.x, d.y);
            // 아주 미세하게 개별 차이가 나는 회전 적용
            ctx.rotate(d.rot);
            ctx.drawImage(img, -BASE_W / 2, -BASE_H / 2, BASE_W, BASE_H);
            ctx.restore();
          }

          if (!noMask) {
            // [침범 방지 2차] 건물 본체, 간판, 바닥 영역 마스킹 (간판 아래 영역은 마스킹하지 않아 비가 내림)
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(buildingLeft, buildingTop, buildingRight - buildingLeft, buildingBottom - buildingTop);
            ctx.fillRect(signLeft, signTop, signRight - signLeft, signBottom - signTop);
            ctx.fillRect(0, bottomY, W, H - bottomY);
            ctx.restore();
          }
        }
      };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }

    /* ==============================================================
       장면 관리자 & 스케일러 (1366x1024 유지 + 2분 무입력 시 1장면 복귀)
       ============================================================== */
    (() => {
      const stage = document.getElementById('stage');
      const W = 1366, H = 1024;
      const IDLE_MS = 2 * 60 * 1000;

      // 비율 유지 스케일
      const fit = () => {
        stage.style.setProperty('--scale', Math.min(innerWidth / W, innerHeight / H));
      };
      addEventListener('resize', fit);
      fit();

      let current = null;

      // ========== S1 배경음악 (1번~18번 장면 재생, 대기화면 슬라이드업 시 동시 시작) ==========
      const ambientAudio = new Audio('02_motions/s1_ambient.mp3');
      ambientAudio.loop = true;
      ambientAudio.preload = 'auto';

      let pendingPlay = false;
      let fadeTimer = null;

      function playAmbient() {
        if (fadeTimer) {
          clearInterval(fadeTimer);
          fadeTimer = null;
        }
        ambientAudio.volume = 0.30;
        const playPromise = ambientAudio.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              pendingPlay = false;
            })
            .catch(() => {
              // 브라우저 자동재생 제한 시 다음 클릭/터치 시 재생 대기
              pendingPlay = true;
            });
        }
      }

      function stopAmbient(fade = true) {
        pendingPlay = false;
        if (fadeTimer) {
          clearInterval(fadeTimer);
          fadeTimer = null;
        }
        if (ambientAudio.paused) return;

        if (!fade) {
          ambientAudio.pause();
          ambientAudio.currentTime = 0;
          ambientAudio.volume = 0.30;
          return;
        }

        const startVol = ambientAudio.volume;
        const duration = 600;
        const startTime = performance.now();
        fadeTimer = setInterval(() => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(1, elapsed / duration);
          ambientAudio.volume = Math.max(0, startVol * (1 - progress));
          if (progress >= 1) {
            clearInterval(fadeTimer);
            fadeTimer = null;
            ambientAudio.pause();
            ambientAudio.currentTime = 0;
            ambientAudio.volume = 0.30;
          }
        }, 30);
      }

      function updateAmbientAudio(n) {
        // S1의 1번(Scene 2)부터 18번(Scene 19)까지 오디오 재생
        if (n >= 2 && n <= 19) {
          if (ambientAudio.paused || fadeTimer) {
            playAmbient();
          }
        } else {
          stopAmbient(true);
        }
      }

      // 브라우저 오디오 자동재생 정책 대응: 사용자가 화면을 클릭하거나 키를 누를 때 대기 중인 오디오 즉시 시작
      ['pointerdown', 'mousedown', 'keydown', 'touchstart'].forEach((ev) => {
        window.addEventListener(ev, () => {
          if (pendingPlay && current && current.n >= 2 && current.n <= 19) {
            playAmbient();
          }
        }, { passive: true });
      });

            const S1_PRELOAD_MAP = {
        1: '01_backgrounds/01.png', 2: '01_backgrounds/02.png', 3: '01_backgrounds/03.png',
        4: '01_backgrounds/04.png', 5: '01_backgrounds/05.png', 6: '01_backgrounds/05, 06 background.png',
        7: '01_backgrounds/07.png', 8: '01_backgrounds/08.png', 9: '01_backgrounds/09.png',
        10: '01_backgrounds/10.png', 11: '01_backgrounds/11.png', 13: '01_backgrounds/13.png',
        14: '01_backgrounds/14 raining background.png', 17: '01_backgrounds/17_human_closeup.png',
        18: '01_backgrounds/18_night_bg.png', 19: '01_backgrounds/19_stairs.png'
      };
      const s1Preloaded = new Set();
      function preloadS1(n) {
        if (typeof n !== 'number') return;
        [n + 1, n - 1].forEach((k) => {
          const bg = S1_PRELOAD_MAP[k];
          if (bg && !s1Preloaded.has(bg)) {
            s1Preloaded.add(bg);
            const im = new Image();
            im.decoding = 'async';
            im.src = bg;
          }
        });
      }

      function goTo(n, transition = 'none') {
        preloadS1(n);
        if (n >= 20) {
          if (window.__TRANSITION_TO_S2__) {
            if (current) destroy(current);
            current = null;
            try { ambientAudio.pause(); } catch(e){}
            try { clearTimeout(idleTimer); } catch(e){}
            if (fadeTimer) clearInterval(fadeTimer);
            window.__TRANSITION_TO_S2__();
            return;
          }
        }
        const def = window.SCENES[n];
        if (!def) { console.warn('장면 없음:', n); return; }

        // 대기화면이 위로 올라감과 동시에 재생 시작 & 1번~18번(n=2~19) 구간 유지/정지
        updateAmbientAudio(n);

        const el = document.createElement('section');
        el.className = `scene scene-${String(n).padStart(2, '0')}`;
        const prev = current;

        if (transition === 'slideUp' && prev) {
          stage.insertBefore(el, prev.el);
          prev.el.classList.add('slide-up-out');
          prev.el.addEventListener('animationend', () => destroy(prev), { once: true });
        } else if (transition === 'fade' && prev) {
          stage.appendChild(el);
          el.classList.add('fade-in');
          el.addEventListener('animationend', () => {
            el.classList.remove('fade-in');
            destroy(prev);
          }, { once: true });
        } else {
          stage.appendChild(el);
          if (prev) {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                destroy(prev);
              });
            });
          }
        }

        current = { n, el, scene: null };
        current.scene = def.mount(el, api) || {};

        // 대화창 맨 아래 줄 또는 대화창 없는 화면의 최상단 레이어에 '현재장면/70' 번호 표기 자동 부착 (대기화면 제외)
        if (n !== 1) { // 대기화면(Scene 1) 제외
          const displayNum = Math.max(1, n - 1);
          const navList = [];
          for (let k = 2; k <= 20; k++) {
            if (window.SCENES[k]) navList.push({ key: k, pageNum: k - 1 });
          }
          const curIdx = Math.max(0, navList.findIndex((item) => item.key === n));
          const maxIdx = Math.max(1, navList.length - 1);
          const ratio = curIdx / maxIdx;
          const fillWidth = (curIdx === maxIdx) ? '100%' : `${Math.max(10, Math.round(10 + (860 - 10) * ratio))}px`;

          const attachCounterAndProgress = (container) => {
            if (!container.querySelector('.scene-counter')) {
              const counterEl = document.createElement('div');
              counterEl.className = 'scene-counter';
              counterEl.textContent = `${displayNum}/72`;
              counterEl.title = '';
              ['mousedown', 'pointerdown', 'click'].forEach((ev) => {
                counterEl.addEventListener(ev, (e) => e.stopPropagation());
              });
              counterEl.addEventListener('dblclick', (e) => {
                e.preventDefault();
                e.stopPropagation();
                window.__SCENE_PROGRESS_OPEN__ = !window.__SCENE_PROGRESS_OPEN__;
                stage.querySelectorAll('.scene-progress-wrap').forEach((w) => {
                  w.classList.toggle('open', !!window.__SCENE_PROGRESS_OPEN__);
                });
              });
              container.appendChild(counterEl);
            }
            if (!container.querySelector('.scene-progress-wrap')) {
              const wrapEl = document.createElement('div');
              wrapEl.className = 'scene-progress-wrap' +
                (window.__SCENE_PROGRESS_OPEN__ ? ' open' : '') +
                (window.__SCENE_PROGRESS_DRAGGING__ ? ' dragging' : '');
              if (typeof window.__SCENE_PROGRESS_HOVER_RATIO__ === 'number') {
                wrapEl.style.setProperty('--hover-ratio', window.__SCENE_PROGRESS_HOVER_RATIO__);
              }
              wrapEl.innerHTML = `
                <div class="scene-progress-bar">
                  <div class="scene-progress-hover"></div>
                  <div class="scene-progress-fill" style="width: ${fillWidth};"></div>
                </div>
              `;
              const barEl = wrapEl.querySelector('.scene-progress-bar');
              const updateHover = (e) => {
                const rect = barEl.getBoundingClientRect();
                if (rect.width <= 0) return;
                const r = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                window.__SCENE_PROGRESS_HOVER_RATIO__ = r;
                wrapEl.style.setProperty('--hover-ratio', r);
                const hoverIdx = Math.max(0, Math.min(navList.length - 1, Math.round(r * maxIdx)));
                if (navList[hoverIdx]) {
                  wrapEl.title = '';
                }
              };
              wrapEl.addEventListener('pointerenter', updateHover);
              wrapEl.addEventListener('pointermove', updateHover);
              ['click', 'dblclick'].forEach((ev) => {
                wrapEl.addEventListener(ev, (e) => e.stopPropagation());
              });

              const seekSceneByClientX = (clientX) => {
                const activeBar = stage.querySelector('.scene-progress-bar') || barEl;
                const rect = activeBar.getBoundingClientRect();
                if (rect.width <= 0 || navList.length === 0) return;
                const r = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
                window.__SCENE_PROGRESS_HOVER_RATIO__ = r;
                const targetIdx = Math.max(0, Math.min(navList.length - 1, Math.round(r * maxIdx)));
                const target = navList[targetIdx];
                if (target && current && current.n !== target.key) {
                  goTo(target.key, 'none');
                }
              };

              wrapEl.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();
                window.__SCENE_PROGRESS_DRAGGING__ = true;
                stage.querySelectorAll('.scene-progress-wrap').forEach((w) => w.classList.add('dragging'));
                seekSceneByClientX(e.clientX);
                const onMove = (ev) => {
                  if (!window.__SCENE_PROGRESS_DRAGGING__) return;
                  ev.preventDefault();
                  seekSceneByClientX(ev.clientX);
                };
                const onUp = () => {
                  window.__SCENE_PROGRESS_DRAGGING__ = false;
                  stage.querySelectorAll('.scene-progress-wrap').forEach((w) => w.classList.remove('dragging'));
                  window.removeEventListener('mousemove', onMove);
                  window.removeEventListener('mouseup', onUp);
                  window.removeEventListener('blur', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                window.addEventListener('blur', onUp);
              });

              wrapEl.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                e.stopPropagation();
                window.__SCENE_PROGRESS_DRAGGING__ = true;
                stage.querySelectorAll('.scene-progress-wrap').forEach((w) => w.classList.add('dragging'));
                seekSceneByClientX(e.touches[0].clientX);
                const onTouchMove = (ev) => {
                  if (!window.__SCENE_PROGRESS_DRAGGING__ || ev.touches.length !== 1) return;
                  ev.preventDefault();
                  seekSceneByClientX(ev.touches[0].clientX);
                };
                const onTouchEnd = () => {
                  window.__SCENE_PROGRESS_DRAGGING__ = false;
                  stage.querySelectorAll('.scene-progress-wrap').forEach((w) => w.classList.remove('dragging'));
                  window.removeEventListener('touchmove', onTouchMove);
                  window.removeEventListener('touchend', onTouchEnd);
                  window.removeEventListener('touchcancel', onTouchEnd);
                };
                window.addEventListener('touchmove', onTouchMove, { passive: false });
                window.addEventListener('touchend', onTouchEnd);
                window.addEventListener('touchcancel', onTouchEnd);
              }, { passive: true });

              container.appendChild(wrapEl);
            }
          };

          const dialogWraps = el.querySelectorAll('.dialog-wrap');
          if (dialogWraps.length > 0) {
            dialogWraps.forEach((dw) => attachCounterAndProgress(dw));
          } else {
            attachCounterAndProgress(el);
          }
        }
        const attachNavButtons = (container) => {
          if (!container) return;
          // 좌측 상단 홈 버튼 (처음 화면으로 복귀)
          if (!container.querySelector('.global-home-btn')) {
            const homeBtn = document.createElement('button');
            homeBtn.type = 'button';
            homeBtn.className = 'global-home-btn';
            homeBtn.setAttribute('aria-label', '처음 화면으로 돌아가기');
            homeBtn.title = '처음 화면으로 돌아가기';
            homeBtn.innerHTML = '<img src="02_motions/home_btn.png" alt="홈">';
            ['mousedown', 'pointerdown', 'touchstart'].forEach((ev) => {
              homeBtn.addEventListener(ev, (e) => e.stopPropagation(), { passive: true });
            });
            homeBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              e.preventDefault();
              if (window.tryPlayBgm) window.tryPlayBgm();
              if (api && api.goTo) {
                api.goTo(1, 'fade');
              } else if (window.__TRANSITION_TO_S1__) {
                window.__TRANSITION_TO_S1__(1);
              }
            });
            container.appendChild(homeBtn);
          }

          // 우측 상단 책읽기/책 고르기 버튼 (46장면 책상 위 책 고르기로 이동)
          // 단, 이미 책을 고르는 46번 장면일 때는 노출하지 않음
          if (n !== 46 && String(n) !== '46' && !container.querySelector('.global-book-btn')) {
            const bookBtn = document.createElement('button');
            bookBtn.type = 'button';
            bookBtn.className = 'global-book-btn';
            bookBtn.setAttribute('aria-label', '책 고르는 화면으로 이동');
            bookBtn.title = '책 고르는 화면으로 이동';
            bookBtn.innerHTML = '<img src="02_motions/book_btn.png" alt="책 고르기">';
            ['mousedown', 'pointerdown', 'touchstart'].forEach((ev) => {
              bookBtn.addEventListener(ev, (e) => e.stopPropagation(), { passive: true });
            });
            bookBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              e.preventDefault();
              if (window.tryPlayBgm) window.tryPlayBgm();
              if (window.__TRANSITION_TO_S2__) {
                if (current) destroy(current);
                current = null;
                try { ambientAudio.pause(); } catch(err){}
                try { clearTimeout(idleTimer); } catch(err){}
                if (fadeTimer) clearInterval(fadeTimer);
                window.__TRANSITION_TO_S2__(46);
              } else if (api && api.goTo) {
                api.goTo(46, 'fade');
              }
            });
            container.appendChild(bookBtn);
          }
        };

        // 3페이지(3장면)부터 좌측 상단 홈 버튼 및 우측 상단 책 고르기 버튼 부착
        if (n >= 3) {
          attachNavButtons(el);
        }

        // 모든 장면에 공통 컬러 필터 레이어 (#FFDB3B, 25%, multiply) 적용 (대기화면 포함)
        const hasDialog = !!el.querySelector('.dialog-wrap');
        const filter = document.createElement('div');
        filter.className = `scene-color-filter ${hasDialog ? 'with-dialog' : 'full'}`;
        el.appendChild(filter);

        resetIdle();
      }

      function destroy(s) {
        if (s.scene && s.scene.unmount) {
          try { s.scene.unmount(); } catch (e) { console.error(e); }
        }
        if (s.el) {
          try {
            const media = s.el.querySelectorAll('img, video, canvas');
            media.forEach((m) => {
              if (m.tagName === 'IMG') { m.src = ''; }
              else if (m.tagName === 'CANVAS') { m.width = 1; m.height = 1; }
            });
            s.el.innerHTML = '';
          } catch (e) {}
          s.el.remove();
        }
      }

      const api = {
        goTo,
        next: (transition) => goTo(current.n + 1, transition),
        prev: (transition) => goTo(Math.max(1, current.n - 1), transition),
        get current() { return current && current.n; },
      };
      window.App = api;

      // 마우스 우클릭 시 이전 장면으로 이동
      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (window.__IS_SIMULTANEOUS_RELOAD__ && window.__IS_SIMULTANEOUS_RELOAD__()) return;
        if (current && (current.n > 1 || current.n === '47_1' || current.n === '48_1')) {
          if (window.__CANCEL_PREV_TIMER__) window.__CANCEL_PREV_TIMER__();
          window.__PENDING_PREV_TIMER__ = setTimeout(() => {
            if (window.__IS_SIMULTANEOUS_RELOAD__ && window.__IS_SIMULTANEOUS_RELOAD__()) return;
            api.prev('fade');
          }, 160);
        }
      });

      // 2분 무입력 타이머
      let idleTimer = null;
      function resetIdle() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (current && current.n !== 1) goTo(1, 'fade');
        }, IDLE_MS);
      }
      ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach((ev) =>
        addEventListener(ev, resetIdle, { passive: true })
      );

      goTo(1);
    })();
  
  </script>

  <script type="text/plain" id="s2-css-data">

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0);
    }

    /* 12.9인치 가로 기준 스테이지 (1366 x 1024) — 다른 비율 기기에서는 중앙 배치 및 레터박스(검정) */
    .stage {
      position: absolute;
      left: 50%; top: 50%;

    @keyframes fluorescentFlicker {
      /* 어둑어둑한 분위기 유지 */
      0%   { opacity: 0.90; }
      12%  { opacity: 0.90; }

      /* 1차 미세 깜빡: 어둠 속에서 켜질랑말랑 살짝 꿈틀 (0.78) */
      18%  { opacity: 0.78; }
      24%  { opacity: 0.90; }

      /* 2차 켜질랑말랑: 조금 더 반응 (0.65) */
      40%  { opacity: 0.65; }
      45%  { opacity: 0.88; }

      /* 3차 전압 상승: 반쯤 깜빡 (0.45) */
      55%  { opacity: 0.45; }
      60%  { opacity: 0.78; }

      /* 4차 지직- 연속 스파크 (0.25 -> 0.58 -> 0.12) */
      68%  { opacity: 0.25; }
      73%  { opacity: 0.58; }
      78%  { opacity: 0.12; }
      82%  { opacity: 0.35; }

      /* 5차 점등 완료! 완전히 불 켜짐 */
      88%  { opacity: 0.00; }
      93%  { opacity: 0.10; } /* 전구 잔여 미세 진동 */
      97%  { opacity: 0.00; }
      100% { opacity: 0.00; } /* 영구 밝음 유지 */
    }

    @keyframes lampFlare {
      /* 초반 어둑어둑할 때는 섬광 없음 */
      0%   { opacity: 0; }
      67%  { opacity: 0; }

      /* 4차 스파크 시 미세 섬광 */
      78%  { opacity: 0.08; }
      82%  { opacity: 0; }

      /* 5차 본격 점등 시 찰나의 전등 빛 퍼짐 */
      88%  { opacity: 0.25; }
      94%  { opacity: 0; }
      100% { opacity: 0; }
    }

      /* 1단 위 안착 및 호흡 (8~11프레임) */

      39%  { transform: translate3d(0, -121px, 0) scale(0.88); opacity: 1; }

          </div>

          <div class="dialog-wrap purple">

            <div class="dialog-text">
              <span class="speaker"></span>
              <span class="dialog-body"></span>
            </div>
          </div>
        `;

        const speakerEl = el.querySelector('.speaker');
        const bodyEl = el.querySelector('.dialog-body');

        // 보라색 대화창 규칙: 대사 (#615CB7, 43px, DungGeunMo)
        const typing = typeDialog(
          speakerEl,
          '',
          bodyEl,
          '책을 골라 보세요. 건너뛰려면 화면을 두 번 클릭하세요.',
          40,
          300
        );

        // arm 마우스 커서 추적 (RAF 감쇠 보간)
        const stage = document.getElementById('stage');
        let stageRect = stage.getBoundingClientRect();
        const updateRect = () => { stageRect = stage.getBoundingClientRect(); };
        window.addEventListener('resize', updateRect);

        const armEl = el.querySelector('.arm-cursor');
        let targetX = 900, targetY = 550;
        let currentX = 900, currentY = 550;
        let armRaf = 0;

        const onMouseMove = (e) => {
          const scale = stageRect.width / 1366;
          const stageX = (e.clientX - stageRect.left) / scale;
          const stageY = (e.clientY - stageRect.top) / scale;

          targetX = Math.max(340, Math.min(1150, stageX));
          targetY = Math.max(180, Math.min(760, stageY));
        };

        const renderArm = () => {
          currentX += (targetX - currentX) * 0.18;
          currentY += (targetY - currentY) * 0.18;
          armEl.style.left = currentX + 'px';
          armEl.style.top = currentY + 'px';
          armRaf = requestAnimationFrame(renderArm);
        };
        armRaf = requestAnimationFrame(renderArm);
        window.addEventListener('mousemove', onMouseMove);

        let lastBookClickTime = 0;
        let lastStageClickTime = 0;
        let isTransitioning = false;
        let bookClickTimer = null;

        const goTo47 = () => {
          if (isTransitioning) return;
          isTransitioning = true;
          if (bookClickTimer) {
            clearTimeout(bookClickTimer);
            bookClickTimer = null;
          }
          app.goTo(47, 'fade');
        };

        // 더블클릭 이벤트: 어디를 더블클릭하든 47장면 이동
        const onDblClick = (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          e.stopPropagation();
          goTo47();
        };

        // 화면 빈 곳 클릭 시 (타이핑 스킵, 빈 화면 더블클릭 시 47장면 이동)
        const onStageClick = (e) => {
          if (e.button !== 0) return;
          if (typing && !typing.isFinished()) {
            typing.finish();
          }
          const now = Date.now();
          if (e.detail >= 2 || (lastStageClickTime > 0 && now - lastStageClickTime < 400)) {
            lastStageClickTime = 0;
            goTo47();
          } else {
            lastStageClickTime = now;
          }
        };

        // 책 클릭 시: 1회 클릭은 책 읽기 화면 오픈, 2회 클릭(더블클릭)은 책 취소하고 47장면으로 이동
        const onBookClick = (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          const now = Date.now();

          // 2번째 클릭(더블클릭) 판정
          if (e.detail >= 2 || (lastBookClickTime > 0 && now - lastBookClickTime < 400)) {
            lastBookClickTime = 0;
            if (bookClickTimer) {
              clearTimeout(bookClickTimer);
              bookClickTimer = null;
            }
            goTo47();
            return;
          }

          // 1번째 클릭: 320ms 후 책 읽기 뷰어 열기
          lastBookClickTime = now;
          const item = e.currentTarget;
          const bookIdx = parseInt(item.dataset.index, 10);
          if (bookClickTimer) {
            clearTimeout(bookClickTimer);
          }
          bookClickTimer = setTimeout(() => {
            bookClickTimer = null;
            lastBookClickTime = 0;
            if (!isTransitioning) {
              if (app.openReader) {
                app.openReader(bookIdx);
              } else {
                window.CURRENT_BOOK_ID = bookIdx;
                app.goTo('reader', 'fade');
              }
            }
          }, 320);
        };

        el.addEventListener('click', onStageClick);
        el.addEventListener('dblclick', onDblClick);
        window.addEventListener('dblclick', onDblClick);

        const bookItems = el.querySelectorAll('.book-item');
        bookItems.forEach((item) => {
          item.addEventListener('click', onBookClick);
        });

        return {
          unmount() {
            if (bookClickTimer) clearTimeout(bookClickTimer);
            cancelAnimationFrame(armRaf);
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('resize', updateRect);
            if (typing) typing.stop();
            el.removeEventListener('click', onStageClick);
            el.removeEventListener('dblclick', onDblClick);
            window.removeEventListener('dblclick', onDblClick);
            bookItems.forEach((item) => {
              item.removeEventListener('click', onBookClick);
            });
          },
        };
      },
    };

    /* ==============================================================

            back: '02_motions/book1_back.png',

          },

          },

            front: '02_motions/book4_front.png',
            back: '02_motions/book4_back.png',
            pageCount: 82,
            pagePrefix: '02_motions/book4_pages/p',
          },
        };

        const currentBook = BOOKS_DATA[bookIdx] || BOOKS_DATA[1];
        const totalSpreads = currentBook.pageCount ? Math.ceil(currentBook.pageCount / 2) : 0;
        // 총 단계 수: 0 = 앞표지, 1..totalSpreads = 양쪽 펼침면, totalSpreads + 1 = 뒷표지
        const totalSteps = totalSpreads > 0 ? totalSpreads + 1 : 1;

        el.innerHTML = `

          <div class="scene-clear-filter"></div>
          <div class="reader-stage">
            <div class="book-viewport">
              <div class="book-page book-page-left" style="display: none;">
